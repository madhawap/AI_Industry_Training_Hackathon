# Application server (avoid :8001 — reserved for Nemotron vLLM on the FT node)
host: "0.0.0.0"
port: 8011

# LiteLLM OpenAI-compatible proxy (org-managed)
# Routes model aliases to the underlying vLLM backends.
litellm_base_url: "${LITELLM_BASE_URL:-http://localhost:4000}"
litellm_key: "${LITELLM_KEY:-}"

# Qwen reasoning brain — planning + tool calls (LiteLLM alias → vLLM :8000)
brain_model: "${BRAIN_MODEL:-agent-brain}"
max_agent_steps: "${MAX_AGENT_STEPS:-5}"

# Fine-tuned Nemotron — final synthesis only (LiteLLM alias → vLLM :8001)
domain_ft_model: "${DOMAIN_FT_MODEL:-domain-ft}"
# How to call domain-ft via LiteLLM: chat (default) | completion
domain_predict_mode: "${DOMAIN_PREDICT_MODE:-chat}"

# LLM call tuning
request_timeout_seconds: 60
temperature_brain: 0.1
temperature_synthesis: 0.2
# Brain: tool-call JSON + short notes. Synthesis: full user answer.
# Both vLLM backends are served with max_model_len=4096. max_tokens is the
# *output* budget; input (system + catalogue + question + history) must still
# fit. The execute_plan catalogue alone is ~2k tokens, so keep brain output small.
max_tokens_brain: 256
max_tokens_synthesis: 512

# Concurrency — must safely handle ≥3 simultaneous /query requests
max_concurrent_queries: 16
http_max_connections: 32

# Tool defaults
default_tool_timeout_seconds: 15
