# Real run against the mock hackathon dataset (data/mock_questions.json).
#
# This is the first config pointed at REAL data rather than stub records. It
# uses the generic adapter with a field map, so it needs no agreed schema —
# only the names of the keys that happen to exist today.
#
# CAVEAT: mock_questions.json has 22 examples. That is enough to prove the
# pipeline end-to-end on real-shaped data; it is NOT enough for a meaningful
# evaluation result. Treat the numbers as plumbing evidence, not model quality.
name: mock
run_id: auto
seed: 0

adapter:
  name: jsonl_generic
  path: ../../data/mock_questions.json
  task_field: difficulty          # easy / medium / hard -> stratification label
  target_field: answer
  input_fields: [question, query_context]   # copied verbatim into `inputs`
  eval_field: grading_components            # -> eval.components
  group_field: null                         # no template id exists yet; row-wise

renderer:
  name: chat
  system_prompt: null             # UNDECIDED — must match serving exactly
  user_template: |-
    QUESTION: {question}
    FACTS: {query_context}
  strict: true

curate:
  group_key: meta.group_key
  splits: [0.7, 0.15, 0.15]       # 22 rows: ~15 / 3 / 4

render:
  measure_with_tokenizer: true

train:
  backend: peft
  model_id: unsloth/Llama-3.2-3B-Instruct
  dtype: bfloat16
  device_map: auto
  seq_len: null                   # filled from render's measured p95
  lora: {rank: 32, alpha: 64, dropout: 0.05, target_modules: all-linear, use_dora: true, use_rslora: true}
  optim:
    steps: 30                     # 15 train rows — more steps just overfits
    lr: 5.0e-5
    warmup: 3
    micro_batch: 1
    grad_accum: 4
    scheduler: cosine
    neftune_noise_alpha: 5.0
  checkpoint_every: 10

predict:
  split: val
  include_checkpoints: true
  max_new_tokens: 96
  temperature: 0.0
  batch_size: 4

evaluate:
  graders: [component_match, format_health, exact_match, reference_overlap]
  component_match: {numeric_tolerance: 0.0, date_equivalence: true}
  format_health: {max_chars: 400}

select:
  policy: guardrailed
  primary: component_recall
  tie_tolerance: 0.005
  prefer_earliest_within_tolerance: true
  guardrails:
    hallucinated_number_rate: {max: 0.05}
    preamble_rate: {max: 0.10}
