# Run against the generated question/answer/tool-trace corpus produced by
# `src/data/generate_training_data.py` (`training/data/generated_questions.jsonl`).
#
# Unlike config/mock.yaml (hand-written mock examples), every record here comes
# from actually running TFQL's execute_plan against the real warehouse built
# from `data set/` -- answers and tool traces are computed, not authored, so
# this is the first config pointed at real-scale, real-data-grounded examples.
# It uses the generic adapter with a field map, same as mock.yaml, since the
# canonical schema still is not agreed -- only the field names that happen to
# exist in generated_questions.jsonl today.
#
# CAVEAT: ~126 examples across 29 template families. Enough to exercise the
# full pipeline end-to-end on real-shaped, real-grounded data; re-run
# generate_training_data.py with more templates/tickers/years before treating
# `evaluate`'s numbers as a meaningful model-quality result rather than
# plumbing evidence.
#
# train.model_id targets the actual hackathon model (nvidia/Llama-3.1-Nemotron-Nano-8B-v1,
# ~16GB bf16 -- needs a mostly-free GPU). Swap back to unsloth/Llama-3.2-3B-Instruct
# for fast iteration; that's still the only line that needs to change (see
# training/ft-pipeline/README.md "Models").
name: generated_large
run_id: auto
seed: 2                          # NOT arbitrary. `curate` shuffles template
                                 # families by this seed, and at seed 0 the val
                                 # split came out 100% `answerable` -- so
                                 # `select`, which reads val metrics, was blind
                                 # to the refusal and extrapolation behaviour.
                                 # Seed 2 puts all three categories in val (see
                                 # the note under `curate`).

adapter:
  name: jsonl_generic
  path: ../data/generated_questions_large.jsonl
  task_field: category                      # answerable / unanswerable / extrapolation -> stratification label
  target_field: answer
  input_fields: [prompt, tool_trace]        # copied verbatim into `inputs`
  eval_field: required_facts                # flat list of gold facts -> eval.components
  group_field: template_family              # split on template, not row -- see generate_training_data.py
  meta_fields: [difficulty, question_type]  # -> meta.difficulty / meta.question_type, read by evaluate.breakdown_by below

renderer:
  name: chat
  system_prompt: null            # UNDECIDED — must match serving exactly
  user_template: |-
    QUESTION: {prompt}
    TOOL_TRACE: {tool_trace}
  strict: true

curate:
  group_key: meta.group_key
  splits: [0.7, 0.15, 0.15]      # was [0.8, 0.1, 0.1], which left val with only
                                 # 2 of 29 families (n=11) -- too few to select a
                                 # checkpoint on, and at 0.8/0.1/0.1 NO seed in
                                 # 0..39 yields a val split covering all three
                                 # categories, because unanswerable and
                                 # extrapolation live in a handful of families.
                                 # 0.7/0.15/0.15 + seed 2 gives:
                                 #   train n=86 / 20 families (71/6/9)
                                 #   val   n=21 /  4 families (18/2/1)
                                 #   test  n=19 /  5 families (17/2/0)
                                 # The seed was chosen on category COVERAGE, not
                                 # on any metric. Group-aware splitting still
                                 # holds -- no family spans two splits.

render:
  measure_with_tokenizer: true

train:
  backend: peft
  model_id: nvidia/Llama-3.1-Nemotron-Nano-8B-v1
  dtype: bfloat16
  device_map: {"": 0}
  seq_len: 1792                  # measured p95 (real Nemotron tokenizer, not char-estimate) via: ftpipe.cli stage render --config config/generated.yaml
  lora:
    rank: 32
    alpha: 64
    dropout: 0.05
    target_modules: all-linear
    use_dora: true
    use_rslora: true
    # PiSSA (Meng et al. 2024, https://huggingface.co/papers/2404.02948): initialises
    # LoRA A/B from the base weight's principal singular vectors/values instead of
    # the reference implementation's zero-init (B=0). Reported to converge faster and
    # reach a better optimum at the same rank/cost -- relevant here since optim.steps
    # is only 100. Falls back to `true` (zero-init) if you want the prior behaviour.
    init_lora_weights: pissa
  optim:
    steps: 100                   # organisers' reference baseline (see config/nemotron.yaml)
    lr: 5.0e-5
    warmup: 10
    micro_batch: 1
    grad_accum: 8
    scheduler: cosine
    neftune_noise_alpha: 5.0
  checkpoint_every: 20
  # Named, swappable loss (see ftpipe/losses.py). label_smoothing=0 and
  # fact_token_weight=1.0 would be identical to the plain masked CE
  # transformers computes internally; fact_token_weight=1.5 upweights tokens
  # that contain a digit -- the numbers/dates component_match and the
  # challenge's own judge actually grade -- by 50% relative to prose tokens.
  loss: {name: masked_ce, label_smoothing: 0.0, fact_token_weight: 1.5}
  # Live training visualisation: event files update DURING training (unlike
  # log_history.json, written once at the end). Watch with, in a second
  # terminal while `train` is running:
  #   tensorboard --logdir runs/generated/train/tensorboard --port 6006
  # Needs the `tensorboard` package (see requirements.txt); [] needs nothing extra.
  report_to: [tensorboard]

predict:
  split: val
  include_checkpoints: true
  max_new_tokens: 128            # gold answers measure p50 43 / p95 74 / max 113
                                 # tokens, so 96 truncated 2 of 126 -- and a
                                 # truncated answer loses components it would
                                 # otherwise have scored.
  temperature: 0.0
  batch_size: 4

evaluate:
  # llm_judge requires ANTHROPIC_API_KEY (or OPENAI_API_KEY with provider: openai)
  # set in the environment before running this stage -- it is not set in this
  # sandbox. It costs one network call + tokens per prediction; the only grader
  # here that can catch hallucination independent of phrasing/number overlap.
  graders: [component_match, format_health, exact_match, reference_overlap, llm_judge]
  component_match: {numeric_tolerance: 0.0, date_equivalence: true}
  format_health: {max_chars: 600}
  llm_judge: {provider: anthropic, model: claude-sonnet-5}
  # Per-slice metrics in addition to per_task (task = category here) -- see
  # ftpipe/stages/evaluate.py's per_breakdown output.
  breakdown_by: [difficulty, question_type]

select:
  policy: guardrailed
  primary: component_recall
  tie_tolerance: 0.005
  prefer_earliest_within_tolerance: true
  guardrails:
    hallucinated_number_rate: {max: 0.05}
    preamble_rate: {max: 0.10}
